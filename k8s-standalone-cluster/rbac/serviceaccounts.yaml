# apiVersion: v1
# kind: Namespace
# metadata:
#   #creationTimestamp: null
#   name: dev
# spec: {}
# status: {}

---
apiVersion: v1
kind: ServiceAccount
metadata:
  #creationTimestamp: null
  name: pod-viewer
  namespace: dev

---
apiVersion: v1
kind: ServiceAccount
metadata:
  #creationTimestamp: null
  name: deployment-manager
  namespace: dev

---
apiVersion: v1
kind: ServiceAccount
metadata:
  #creationTimestamp: null
  name: cluster-auditor
  namespace: dev

---
# 3. Role: read Pods only in dev
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: pod-reader
  namespace: dev
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
# 4. RoleBinding: pod-viewer -> pod-reader
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: pod-viewer-binding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: pod-viewer
    namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: pod-reader

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-manager-role
  namespace: dev
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
# 6. RoleBinding: deployment-manager -> deployment-manager-role
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deployment-manager-binding
  namespace: dev
subjects:
  - kind: ServiceAccount
    name: deployment-manager
    namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: deployment-manager-role

---
# 7. ClusterRole: read Pods and Deployments cluster-wide
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cluster-auditor-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
# 8. ClusterRoleBinding: cluster-auditor -> cluster-auditor-role
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: cluster-auditor-binding
subjects:
  - kind: ServiceAccount
    name: cluster-auditor
    namespace: dev
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-auditor-role

