apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: node-log-agent
  namespace: e-app
spec:
  selector:
    matchLabels:
      app: node-log-agent
  template:
    metadata:
      labels:
        app: node-log-agent
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
      containers:
        - name: log-agent
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Node log agent started"
              while true; do
                if [ -f /host-logs/demo.log ]; then
                  tail -n 5 /host-logs/demo.log
                fi
                sleep 30
              done
          volumeMounts:
            - name: host-logs
              mountPath: /host-logs
              readOnly: true
      volumes:
        - name: host-logs
          hostPath:
            path: /var/log
            type: Directory