apiVersion: v1
#kind: apiVersion: v1
kind: Pod
metadata:
  name: storage-test
spec:
  containers:
    - name: writer
      image: busybox:1.36
      command: ["sh", "-c", "while true; do date >> /data/timestamps.txt; sleep 10; done"]
      volumeMounts:
      - name: local-storage
        mountPath:  /data
  volumes:
  - name:  local-storage
    persistentVolumeClaim:
      claimName: mypvc
  
