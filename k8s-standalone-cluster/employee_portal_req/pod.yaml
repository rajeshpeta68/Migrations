apiVersion: v1
kind: Pod
metadata:
  name: debug-pod
  namespace: e-app
  labels:
    app: debug
spec:
  containers:
    - name: debug
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
        limits:
          cpu: 200m
          memory: 64Mi
