apiVersion: apps/v1
kind: Deployment
metadata:
  #creationTimestamp: null
  labels:
    app: frontend
  name: frontend
  namespace: e-app
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  strategy: 
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    #type: RollingUpdate
  template:
    metadata:
      #creationTimestamp: null
      labels:
        app: frontend
    spec:
      containers:
      - image: nginx:1.28
        name: nginx
        ports:
        - containerPort: 80
        envFrom:
          - configMapRef:
              name: my-config
        volumeMounts:
          - name:  web-content
            mountPath:  /usr/share/nginx/html/index.html
            subPath: index.html
      volumes:
         - name: web-content
           configMap: 
             name: my-config
             items:
               - key: index.html
                 path: index.html
