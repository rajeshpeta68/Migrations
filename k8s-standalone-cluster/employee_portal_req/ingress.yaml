apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: employee-portal
  namespace: e-app
spec:
  ingressClassName: nginx
  rules:
    - host: employee.lab.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-service
                port:
                  number: 80