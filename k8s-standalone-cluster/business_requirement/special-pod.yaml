apiVersion: v1
kind: Pod
metadata:
  name: special-worker-pod
  namespace: advanced-lab
spec:
  tolerations:
    - key: dedicated
      operator: Equal
      value: special
      effect: NoSchedule
  containers:
    - name: app
      image: busybox:1.36
      command: ["sh", "-c", "sleep 36000"]
      resources:
        requests:
          cpu: 50m
          memory: 32Mi
